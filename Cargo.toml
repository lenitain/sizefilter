[package]
name = "sizefilter"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Human-readable size string parsing, formatting, and filtering with comparison operators (e.g., \">=1GB\", \"<500KB\")"
documentation = "https://docs.rs/sizefilter"
repository = "https://github.com/lenitain/sizefilter"
readme = "README.md"
keywords = ["size", "parse", "format", "filter", "human-readable"]
categories = ["parsing", "command-line-utilities"]
authors = ["lenitain <xt.zhu@qq.com>"]

include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "src/",
]

[lib]
name = "sizefilter"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
