[package]
name = "sizefilter"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Human-readable size string parsing, formatting, and filtering with comparison operators (e.g., \">=1GiB\", \"<500KiB\")"
documentation = "https://docs.rs/sizefilter"
repository = "https://github.com/lenitain/sizefilter"
readme = "README.md"
keywords = ["size", "parse", "format", "filter", "human-readable"]
categories = ["parsing", "command-line-utilities"]
authors = ["lenitain <xt.zhu@qq.com>"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
